# HRAG — Full Stack (Production)
# Usage: cp .env.example .env && docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: hrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrag
    ports:
      - "5433:5432"
    volumes:
      - hrag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: hrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - hrag_chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrag-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI  →  http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - hrag_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: hrag-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Webhook notification target — id "HRAG"
      MINIO_NOTIFY_WEBHOOK_ENABLE_HRAG: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_HRAG: "http://backend:8080/api/v1/minio/events"
    volumes:
      - hrag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: hrag-neo4j
    ports:
      - "7474:7474"   # Browser UI → http://localhost:7474
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/hrag1234
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - hrag_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hrag-backend
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── minio-init: create buckets + register webhook event ─────────────────
  minio-init:
    image: minio/mc:latest
    container_name: hrag-minio-init
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/hrag-uploads;
        mc mb --ignore-existing local/hrag-markdown;
        mc event add --ignore-existing local/hrag-uploads
          arn:minio:sqs::HRAG:webhook --event put;
        mc anonymous set-json /dev/stdin local/hrag-uploads <<'CORS'
        {
          \"CORSRules\": [{
            \"AllowedOrigins\": [\"*\"],
            \"AllowedMethods\": [\"PUT\", \"GET\", \"HEAD\"],
            \"AllowedHeaders\": [\"*\"],
            \"ExposeHeaders\": [\"ETag\"],
            \"MaxAgeSeconds\": 3000
          }]
        }
        CORS
        exit 0
      "
    restart: on-failure

  # ── vllm-ocr (HunyuanOCR for scanned PDF OCR) ────────────────────────────
  # Port: 8001, GPU 1, ~19.2GB VRAM (0.4 × 48GB)
  vllm-ocr:
    image: vllm/vllm-openai:latest
    container_name: hrag-vllm-ocr
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - tencent/HunyuanOCR
      - --port
      - "8001"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.4"
      - --trust-remote-code
      - --served-model-name
      - hunyuan-ocr
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  # ── vllm-memory (Qwen3-4B for document classification) ─────────────────────
  # Port: 8088, GPU 1, ~9.6GB VRAM (0.2 × 48GB)
  vllm-memory:
    image: vllm/vllm-openai:latest
    container_name: hrag-vllm-memory
    ports:
      - "8088:8088"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - Qwen/Qwen3-4B-Instruct-2507-FP8
      - --port
      - "8088"
      - --max-model-len
      - "17000"
      - --gpu-memory-utilization
      - "0.25"
      - --trust-remote-code
      - --served-model-name
      - qwen-memory
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: always

  # ── Parse workers (GPU-accelerated Docling, lazy load) ────────────────────
  # Docling layout + OCR → ~4-6GB VRAM when loaded
  # HRAG_EAGER_MODEL_LOADING=false prevents VRAM spike at startup
  worker-parse:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      vllm-memory:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: parse
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_DOCLING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Embed workers (BGE-m3 on GPU 1) ────────────────────────────────────────
  # BGE-m3 embedding model → ~1-2GB VRAM, lazy load
  worker-embed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "true"
      WORKER_TYPE: embed
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_EMBEDDING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Caption workers (HTTP calls to vLLM, no GPU model) ────────────────────
  # Caption worker calls LLM via HTTP — GPU not used by this worker process
  worker-caption:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "true"
      WORKER_TYPE: caption
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── KG workers (LightRAG, CPU-bound, GPU for consistency) ─────────────────
  worker-kg:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: kg
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - hrag_data:/app/backend/data
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hrag-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"
    restart: unless-stopped

volumes:
  hrag_postgres_data:
  hrag_chroma_data:
  hrag_rabbitmq_data:
  hrag_uploads:
  hrag_data:
  hrag_minio_data:
  hrag_neo4j_data:
