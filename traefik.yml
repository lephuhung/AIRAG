# Traefik static configuration
# Static configuration is loaded before any dynamic configuration.

api:
  dashboard: true
  insecure: true  # Only for .local development environment

entrypoints:
  http:
    address: ":80"

  https:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false  # Only services with traefik.enable=true are exposed
    network: hrag_network

  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log

# DNS resolver for .local domains
hostsResolver:
  enabled: true

# Certificate resolver for self-signed certificates
certificatesResolvers:
  selfsigned:
    acme:
      # Using self-signed for .local domains (no CA)
      # For actual HTTPS, use let's encrypt with dnsChallenge
      storage: /letsencrypt/acme.json