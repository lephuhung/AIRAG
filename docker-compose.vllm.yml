# HRAG — vLLM GPU engines (split out from the main services stack)
# ─────────────────────────────────────────────────────────────────────────────
# These two engines load large models and take ~minutes to become healthy, so
# they live in their OWN compose file. That way `docker compose -f
# docker-compose.services.yml up/down` no longer pulls them along — they stay up
# while the rest of the app is cycled.
#
# Usage (bring the engines up ONCE, leave them running):
#   docker compose -f docker-compose.vllm.yml up -d
#   docker compose -f docker-compose.vllm.yml down        # only when you really mean it
#
# Networking: both stacks share the EXISTING bridge network `airag_hrag_network`
# (declared external here) so workers/backend reach the engines by service name
# (vllm-ocr:8001 / vllm-memory:8088). The network is created by the services
# stack; on a fresh host create it once first:
#   docker network create airag_hrag_network

networks:
  hrag_network:
    external: true
    name: airag_hrag_network

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # VLLM SERVICES — GPU 0 (same as workers, 48GB VRAM total)
  # vllm-ocr (Unlimited-OCR): ~10GB (0.2)  |  vllm-memory (gemma-4-E4B, served as
  # `qwen-memory`): ~29GB (0.6)  → ~39GB locked upfront by the two vLLM engines.
  # Remaining ~9GB shared by GPU workers (parse Docling + embed bge-m3 ×3).
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Unlimited-OCR (Baidu, OCR Model) ──────────────────────────────────────
  # Port: 8001, GPU 0, ~10GB VRAM (0.2 × 48GB). ~3B model → needs more VRAM
  # than the old 1B HunyuanOCR, hence gpu-memory-utilization bumped 0.13 → 0.20.
  # OpenAI-compatible API → workers call via Docker network.
  #
  # Uses Baidu's OFFICIAL prebuilt vLLM image (NOT Dockerfile.vllm) — it ships
  # the custom `unlimited_ocr` model code + NGram logits processor that the
  # stock vllm-openai image does not have. Default tag = CUDA 13.0 (works on the
  # Ampere RTX A6000 here); the `:unlimited-ocr-cu129` tag is only for Hopper.
  # Serve flags follow https://recipes.vllm.ai/baidu/Unlimited-OCR verbatim.
  vllm-ocr:
    image: vllm/vllm-openai:unlimited-ocr
    container_name: hrag-vllm-ocr
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - baidu/Unlimited-OCR
      - --port
      - "8001"
      - --max-model-len
      - "12288"
      - --gpu-memory-utilization
      - "0.22"
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      # GPU 0 is shared with vllm-memory (0.6) + workers; only ~11 GB free.
      # enforce-eager skips the multi-MB CUDA-graph capture so the 3B weights
      # leave room for the KV cache within the 0.22 (~10.8 GB) budget.
      - --enforce-eager
      - --served-model-name
      - unlimited-ocr
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-ocr
      com.hrag.stack: hrag

  # ── gemma-4-E4B-it (Memory/KG Model, served as `qwen-memory`) ─────────────
  # Port: 8088, GPU 0, ~22GB VRAM (0.45 × 48GB) — gemma-4-E4B weights ~15GB + KV cache
  # OpenAI-compatible API → workers call via Docker network.
  # Serves supervisor (intent), Graphiti memory + Legal KG — all send ≤1.2k-token
  # chunks + ≤4k output, so max-model-len 8192 is ample. enforce-eager drops the
  # CUDA-graph spike so the lower 0.45 budget still leaves a healthy KV cache.
  vllm-memory:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-memory
    ports:
      - "8088:8088"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      HF_TOKEN: "${HF_TOKEN}"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_USE_V1: "0"
      VLLM_DISABLE_NIXL: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - google/gemma-4-E4B-it
      - --port
      - "8088"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.45"
      - --enforce-eager
      - --trust-remote-code
      - --served-model-name
      - qwen-memory
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-memory
      com.hrag.stack: hrag
