# HRAG — vLLM GPU engines (split out from the main services stack)
# ─────────────────────────────────────────────────────────────────────────────
# These two engines load large models and take ~minutes to become healthy, so
# they live in their OWN compose file. That way `docker compose -f
# docker-compose.services.yml up/down` no longer pulls them along — they stay up
# while the rest of the app is cycled.
#
# Usage (bring the engines up ONCE, leave them running):
#   docker compose -f docker-compose.vllm.yml up -d
#   docker compose -f docker-compose.vllm.yml down        # only when you really mean it
#
# Networking: both stacks share the EXISTING bridge network `airag_hrag_network`
# (declared external here) so workers/backend reach the engines by service name
# (vllm-ocr:8001 / vllm-memory:8088). The network is created by the services
# stack; on a fresh host create it once first:
#   docker network create airag_hrag_network

networks:
  hrag_network:
    external: true
    name: airag_hrag_network

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # VLLM SERVICES — GPU 0 (same as workers, 48GB VRAM total)
  # Budget (2026-07-04): vllm-ocr 0.28 (~13.8GB) | vllm-memory 0.50 (~24.6GB)
  # → ~38.4GB engines + ~7GB fixed (omnivoice TTS 2.3GB, embed bge-m3 4.8GB)
  # ≈ 45.5GB, để ~3.5GB slack cho CUDA-graph capture + fragmentation.
  # CUDA graphs BẬT (không enforce-eager) cho cả hai — eager từng làm decode
  # chậm ~2× (đo 24 tok/s gemma). --max-num-seqs chặn kích thước graph capture
  # nên spike khởi động chỉ vài trăm MB, không cần eager nữa.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Unlimited-OCR (Baidu, OCR Model) ──────────────────────────────────────
  # Port: 8001, GPU 0, ~10GB VRAM (0.2 × 48GB). ~3B model → needs more VRAM
  # than the old 1B HunyuanOCR, hence gpu-memory-utilization bumped 0.13 → 0.20.
  # OpenAI-compatible API → workers call via Docker network.
  #
  # Uses Baidu's OFFICIAL prebuilt vLLM image (NOT Dockerfile.vllm) — it ships
  # the custom `unlimited_ocr` model code + NGram logits processor that the
  # stock vllm-openai image does not have. Default tag = CUDA 13.0 (works on the
  # Ampere RTX A6000 here); the `:unlimited-ocr-cu129` tag is only for Hopper.
  # Serve flags follow https://recipes.vllm.ai/baidu/Unlimited-OCR verbatim.
  vllm-ocr:
    image: vllm/vllm-openai:unlimited-ocr
    container_name: hrag-vllm-ocr
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      # Serve from the local HF cache only — never hit the hub. Upstream revision
      # bumps otherwise force a full re-download on container recreate (2026-07-05:
      # gemma re-download 16GB × N retries filled the disk and crash-looped).
      HF_HUB_OFFLINE: "1"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    command:
      - baidu/Unlimited-OCR
      - --port
      - "8001"
      - --max-model-len
      - "12288"
      # 0.22 cho KV chỉ 23.7k tokens (concurrency 1.93x @12k) trong khi worker
      # bắn HRAG_OCR_CONCURRENCY=16 trang song song → trang xếp hàng. 0.28 ≈
      # gấp đôi KV để batch thật sự ~16 trang.
      - --gpu-memory-utilization
      - "0.28"
      # Giới hạn batch = mức worker thực dùng → CUDA graph capture nhỏ, đủ chỗ
      # bật graphs (bỏ enforce-eager) lấy lại tốc độ decode.
      - --max-num-seqs
      - "16"
      - --trust-remote-code
      - --logits_processors
      - vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb
      - "0"
      - --served-model-name
      - unlimited-ocr
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-ocr
      com.hrag.stack: hrag

  # ── gemma-4-E4B-it (Memory/KG Model, served as `qwen-memory`) ─────────────
  # Port: 8088, GPU 0, ~20.8GB VRAM (0.42 × 48GB) — weights ~15GB + KV ~5GB
  # (~156k tokens > peak thực tế ~125k: contextual 16 + KG 8, ~5.2k tokens/req).
  # 0.50 gây CUDA OOM tổng thể: backend embedder+reranker 6.4GB + embed worker
  # ~3GB + omnivoice 2.3GB + Docling 1.6GB → tổng resident vượt 48GB, spike
  # encode (~0.6GB) hết chỗ. Giữ headroom steady-state ≥2GB.
  # OpenAI-compatible API → workers call via Docker network.
  # Serves supervisor (intent), Graphiti memory, Legal KG + contextual embed —
  # peak thực tế ~24 request song song (contextual 16 + KG 8), request ≤1.2k in
  # + ≤4k out nên max-model-len 8192 là đủ. CUDA graphs BẬT (max-num-seqs 32
  # chặn spike capture); enforce-eager cũ làm decode chậm ~2× (24 tok/s).
  vllm-memory:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-memory
    ports:
      - "8088:8088"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      HF_TOKEN: "${HF_TOKEN}"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_USE_V1: "0"
      VLLM_DISABLE_NIXL: "1"
      # Serve from the local HF cache only (see vllm-ocr note) — cached snapshot
      # fee6332 is complete; hub's newer revision must not trigger a re-download.
      HF_HUB_OFFLINE: "1"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    command:
      - google/gemma-4-E4B-it
      - --port
      - "8088"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.42"
      - --max-num-seqs
      - "32"
      - --trust-remote-code
      - --served-model-name
      - qwen-memory
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-memory
      com.hrag.stack: hrag
