# HRAG — Dev/Production services with Workers
# Usage: docker compose -f docker-compose.services.yml up -d
#
# Langfuse (observability) is pulled in via include: below so one `up -d`
# starts the whole platform — incident 2026-06-29→07-05: a redeploy brought
# only this stack back and Langfuse stayed down 6 days (traces dropped, not
# replayable). NOTE: `down` on this file now also stops Langfuse.

include:
  - docker-compose.langfuse.yml

networks:
  # Shared bridge network — also joined (as external) by docker-compose.vllm.yml
  # so workers/backend reach the vLLM engines by service name. Pinned to a fixed
  # name so both stacks resolve to the same physical network regardless of which
  # comes up first. Create once on a fresh host: docker network create airag_hrag_network
  hrag_network:
    external: true
    name: airag_hrag_network

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # TRAEFIK REVERSE PROXY
  # ═══════════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:latest
    container_name: hrag-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8089:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - hrag_traefik_data:/letsencrypt
    networks:
      - hrag_network
    environment:
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    labels:
      - "com.hrag.service=traefik"
      - "com.hrag.stack=hrag"
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.hatinh.local`)"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # ═══════════════════════════════════════════════════════════════════════════
  # CLOUDFLARE TUNNEL — expose the app publicly via a named tunnel
  # ═══════════════════════════════════════════════════════════════════════════
  # Locally-managed (config.yml based) tunnel `zbots-tunnel`. Config + creds live
  # in ./cloudflared, mounted at /etc/cloudflared:
  #   - cert.pem                                   → origin cert (cloudflared login)
  #   - config.yml                                 → tunnel name + ingress rules
  #   - 95713781-76f3-40ca-b96f-25433b340d7d.json  → per-tunnel credentials (secret)
  # config.yml routes Host(bot.zbots.store) → http://hrag-backend:8080 and
  # Host(rag.zbots.store) → http://hrag-frontend:5174 (full web UI; Vite proxies
  # /api + /minio-direct itself) — cloudflared is on hrag_network so it reaches
  # both by container name. New hostname? add an ingress rule in config.yml, run
  # `cloudflared tunnel route dns zbots-tunnel <host>` (inside the container),
  # add the host to vite allowedHosts, then restart cloudflared (+ frontend).
  # The Telegram webhook then becomes:
  #   https://bot.zbots.store/api/v1/integrations/telegram/webhook
  # Only starts with the "tunnel" profile so the rest of the stack can run without it:
  #   docker compose -f docker-compose.services.yml --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hrag-cloudflared
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run zbots-tunnel
    environment:
      - TUNNEL_ORIGIN_CERT=/etc/cloudflared/cert.pem
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend
    networks:
      - hrag_network
    restart: unless-stopped
    labels:
      - "com.hrag.service=cloudflared"
      - "com.hrag.stack=hrag"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg15
    container_name: hrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrag
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "5433:5432"
    volumes:
      - hrag_postgres_data:/var/lib/postgresql/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hrag.service: postgres
      com.hrag.stack: hrag

  chromadb:
    image: chromadb/chroma:latest
    container_name: hrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - hrag_chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - hrag_network
    restart: unless-stopped
    labels:
      com.hrag.service: chromadb
      com.hrag.stack: hrag

  # Shared cross-process state for the backend (stream-cancel pub/sub, and
  # later the distributed GPU semaphore + retrieval cache). Ephemeral — no
  # persistence needed; pub/sub is transient and the cache is regenerable.
  redis:
    image: redis:7-alpine
    container_name: hrag-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      com.hrag.service: redis
      com.hrag.stack: hrag
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrag-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - hrag_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    labels:
      com.hrag.service: rabbitmq
      com.hrag.stack: hrag

  minio:
    image: minio/minio:latest
    container_name: hrag-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_NEXUSRAG: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_NEXUSRAG: http://host.docker.internal:8080/api/v1/minio/events
    volumes:
      - hrag_minio_data:/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      com.hrag.service: minio
      com.hrag.stack: hrag
      traefik.enable: "true"
      traefik.http.routers.minio.rule: "Host(`minio.hatinh.local`)"
      traefik.http.routers.minio.entrypoints: "http"
      traefik.http.services.minio.loadbalancer.server.port: "9000"

  neo4j:
    image: neo4j:5-community
    container_name: hrag-neo4j
    ports:
      - "7474:7474"   # Browser UI → http://localhost:7474
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/hrag1234
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - hrag_neo4j_data:/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    labels:
      com.hrag.service: neo4j
      com.hrag.stack: hrag

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKERS — All use GPU 1 (same as vLLM services, 48GB VRAM total)
  # vLLM uses ~28.8GB, workers have ~19GB available (parse ~4-6GB, embed ~1-2GB)
  # Caption/KG workers don't load GPU models (HTTP calls / CPU-bound)
  # All workers include: graceful drain (WORKER_DRAIN_TIMEOUT=30s),
  # stop_grace_period=60s (Docker waits 60s before SIGKILL on stop)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Parse workers ─────────────────────────────────────────────────────────
  # Docling (layout + OCR) → ~4-6GB VRAM when loaded
  # Lazy load (HRAG_EAGER_MODEL_LOADING=false) to avoid VRAM spike at startup
  # Health server on port 8081, exposed to host on port 8082
  worker-parse:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # vllm-ocr / vllm-memory live in docker-compose.vllm.yml (separate stack) —
      # reached at runtime via http://vllm-*:* over the shared network.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: parse
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      HRAG_DOCLING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      # Persist OCR model caches across container recreates → fast startup
      # (EasyOCR vi+en ~100MB, Docling layout/tableformer). Pre-downloaded on host.
      - /root/.EasyOCR:/root/.EasyOCR
      - /root/.cache/docling:/root/.cache/docling
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw   # live source — `restart` picks up code changes, no rebuild
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-parse
      com.hrag.stack: hrag

  # ── Embed workers ───────────────────────────────────────────────────────────
  # BGE-m3 embedding model → ~1-2GB VRAM
  # Health server on port 8081
  worker-embed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: embed
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_EMBEDDING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      WORKER_EMBED_TIMEOUT: "300"
      HRAG_CONTEXTUAL_CONCURRENCY: "16"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw   # live source — `restart` picks up code changes, no rebuild
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-embed
      com.hrag.stack: hrag

  # ── Caption workers ─────────────────────────────────────────────────────────
  # Vision LLM captions via HTTP calls to vLLM (no GPU model loaded in worker)
  # Workers call LLM provider via HTTP — GPU not used by caption worker process
  # Health server on port 8081
  worker-caption:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: caption
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw   # live source — `restart` picks up code changes, no rebuild
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
      - "host.docker.internal:host-gateway"
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-caption
      com.hrag.stack: hrag

  # ── KG workers ─────────────────────────────────────────────────────────────
  # LightRAG file-based KG extraction (CPU-bound, no GPU model)
  # GPU assigned for consistency but not used
  # Health server on port 8081
  worker-kg:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # vllm-memory now lives in docker-compose.vllm.yml (separate stack) —
      # reached at runtime via http://vllm-memory:8088 over the shared network.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: http://minio:9000
      WORKER_TYPE: kg
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw   # live source — `restart` picks up code changes, no rebuild
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
      - "host.docker.internal:host-gateway"
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-kg
      com.hrag.stack: hrag

  # ── Memory worker ───────────────────────────────────────────────────────────
  # Graphiti personal-memory: LLM fact-extraction (vllm-memory) + Neo4j write.
  # Durable queue (hrag.memory) with RabbitMQ retry/DLQ. No GPU model loaded.
  worker-memory:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # vllm-memory now lives in docker-compose.vllm.yml (separate stack) —
      # reached at runtime via http://vllm-memory:8088 over the shared network.
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: memory
      AUTO_CREATE_TABLES: "false"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - ./backend:/app/backend:rw   # live source — `restart` picks up code changes, no rebuild
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
      - "host.docker.internal:host-gateway"
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-memory
      com.hrag.stack: hrag

  # ── Backend API server ─────────────────────────────────────────────────────
  # ── OmniVoice (Text-to-Speech) ────────────────────────────────────────────
  # Port: 8880, GPU 0 (shared, ~few GB VRAM). OpenAI-compatible /v1/audio/speech.
  # ONE-TIME SETUP: the image is built from the upstream repo, not this one —
  #   git clone https://github.com/maemreyo/omnivoice-server external/omnivoice-server
  # Then `docker compose -f docker-compose.services.yml build omnivoice`.
  # NOTE: OmniVoice is English/Chinese focused; Vietnamese quality is unverified.
  omnivoice:
    image: omnivoice-server:latest
    pull_policy: never  # local build only
    build:
      context: ./external/omnivoice-server
      dockerfile: Dockerfile.cuda
    container_name: hrag-omnivoice
    ports:
      - "8880:8880"
    environment:
      OMNIVOICE_HOST: "0.0.0.0"
      OMNIVOICE_PORT: "8880"
      OMNIVOICE_DEVICE: "cuda"
      OMNIVOICE_NUM_STEP: "32"
      OMNIVOICE_MAX_CONCURRENT: "2"
      OMNIVOICE_MODEL_ID: "k2-fsa/OmniVoice"
      OMNIVOICE_LOG_LEVEL: "info"
    volumes:
      # Dedicated named volume (not the host ~/.cache, which is root-owned and
      # un-writable by the container's uid-1000 'ubuntu' user → HF Permission denied).
      - hrag_omnivoice_hf:/home/ubuntu/.cache/huggingface
      - hrag_omnivoice_profiles:/home/ubuntu/app/profiles
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: omnivoice
      com.hrag.stack: hrag

  # ── Embed + Rerank GPU microservice ──────────────────────────────────────
  # Hosts the SentenceTransformer embedder + CrossEncoder reranker on GPU 0 and
  # serves them over HTTP (:8090). Backend/workers set HRAG_EMBED_RERANK_URL to
  # this and become thin HTTP clients → they hold NO GPU state, so the backend
  # can run WEB_CONCURRENCY>1 without N× copies of the retrieval models. It runs
  # the very same image + code in *in-process* mode (HRAG_EMBED_RERANK_URL empty).
  # One shared copy fields the whole cluster; EMBED_RERANK_CONCURRENCY bounds the
  # rerank fan-out (memory `search-cuda-oom-silent-fail`). Models are already in
  # the HF cache (backend loads them today) → no new download. See docs/scaling.md.
  embed-rerank:
    # Reuse the already-built backend image (identical code; source is bind-mounted
    # live below) — no separate build, which would redundantly rebuild multiple GB
    # and, on a near-full disk, fail at `pip install`.
    image: airag-backend:latest
    container_name: hrag-embed-rerank
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      # Must be EMPTY here — this process IS the model host (in-process mode).
      HRAG_EMBED_RERANK_URL: ""
      HRAG_EMBEDDING_DEVICE: cuda
      HRAG_RERANKER_DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
      # Hard ceiling on concurrent GPU batches (embed + rerank share the GPU).
      EMBED_RERANK_CONCURRENCY: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    command: ["uvicorn", "embed_rerank_service.main:app", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - ./backend:/app/backend:rw   # live source, same as backend/workers
    networks:
      - hrag_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s   # model load + warmup takes tens of seconds
    restart: unless-stopped
    labels:
      com.hrag.service: embed-rerank
      com.hrag.stack: hrag

  # ── PII extraction microservice (CPU) ──────────────────────────────────
  # Hosts the Meddies/meddies-pii-v2 model (350M-param causal LM) for
  # multilingual PII extraction, served over HTTP (:8092). The people-agent
  # calls this to extract phone numbers, CCCD, BHXH and human names from
  # Vietnamese queries before routing to MongoDB. CPU-only by default.
  pii-service:
    image: airag-backend:latest
    container_name: hrag-pii-service
    env_file: .env
    environment:
      PII_MODEL_NAME: Meddies/meddies-pii-v2
      PII_DEVICE: cpu
      PII_CONCURRENCY: "2"
    command: ["uvicorn", "pii_service.main:app", "--host", "0.0.0.0", "--port", "8092"]
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - ./backend:/app/backend:rw
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    labels:
      com.hrag.service: pii-service
      com.hrag.stack: hrag

  # ── Whisper STT microservice (CPU sidecar) ───────────────────────────────
  # Hosts faster-whisper (CTranslate2, CPU int8) behind an OpenAI-compatible
  # /v1/audio/transcriptions endpoint (:8091). Backend sets STT_PROVIDER=openai +
  # STT_OPENAI_BASE_URL to this and drops its in-process Whisper copy → backend
  # workers stay pure-CPU. NO GPU reservation: STT is deliberately CPU (CTranslate2
  # needs CUDA 12 but the image ships CUDA 13), so it never touches the 48GB GPU.
  # Reuses the backend image (source bind-mounted). Runs in-process mode
  # (STT_PROVIDER=faster_whisper here — it IS the model host). See docs/scaling.md.
  stt:
    image: airag-backend:latest
    container_name: hrag-stt
    env_file: .env
    environment:
      STT_PROVIDER: faster_whisper   # must be local here — this process hosts the model
      STT_FW_MODEL: large-v3
      STT_FW_DEVICE: cpu
      STT_FW_COMPUTE_TYPE: int8
    command: ["uvicorn", "stt_service.main:app", "--host", "0.0.0.0", "--port", "8091"]
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - ./backend:/app/backend:rw
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s   # large-v3 CPU load ~70s + first-call compile
    restart: unless-stopped
    labels:
      com.hrag.service: stt
      com.hrag.stack: hrag

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        TARGET: ${APP_ENV:-development}
    container_name: hrag-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      embed-rerank:
        condition: service_healthy
      stt:
        condition: service_started
      pii-service:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      # Flip to "true" (with the redis service up) to enable multi-worker /
      # multi-replica: cross-process Stop, shared GPU limit + retrieval cache.
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      # Backend worker processes. Default 1. >1 needs the production image
      # (APP_ENV=production — the dev target runs --reload/1 worker), REDIS_ENABLED
      # =true, and AUTO_CREATE_TABLES=false. GPU headroom is NO LONGER the limit:
      # with HRAG_EMBED_RERANK_URL set the backend holds no GPU state, so N workers
      # cost only CPU/RAM (retrieval models live in the embed-rerank service).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Route embed/rerank to the GPU microservice (default on). Set empty to load
      # the models in-process in the backend instead. See docs/scaling.md.
      HRAG_EMBED_RERANK_URL: ${HRAG_EMBED_RERANK_URL-http://embed-rerank:8090}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      # Backend VRAM creeps up over days (fragmentation of embedder/reranker
      # allocations) until tiny search-time allocs OOM — expandable segments
      # curb the fragmentation (incident 2026-07-04: search silently degraded).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
      TTS_OMNIVOICE_BASE_URL: http://omnivoice:8880/v1
      # Whisper (STT) now lives in the `stt` CPU sidecar — the backend is a thin
      # OpenAI-compatible client and holds NO Whisper model (so it scales on CPU).
      # Set STT_PROVIDER=faster_whisper + empty base URL to run it in-process again.
      STT_PROVIDER: openai
      STT_OPENAI_BASE_URL: http://stt:8091/v1
      # Route PII extraction to the CPU microservice (default on). Set empty to
      # skip PII extraction in the people-agent (fallback to regex / LLM).
      PII_SERVICE_URL: ${PII_SERVICE_URL-http://pii-service:8092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "langfuse.hatinh.local:10.10.0.241"
    # Host PID namespace so NVML (/workers/gpu) can see GPU processes of the
    # OTHER containers (vLLM engines, workers) — inside an isolated namespace
    # nvmlDeviceGetComputeRunningProcesses only returns the backend's own PID.
    pid: "host"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hrag_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`service.hatinh.local`)"
      - "traefik.http.routers.backend.entrypoints=http"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "com.hrag.service=backend"
      - "com.hrag.stack=hrag"
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        TARGET: ${APP_ENV:-development}
    container_name: hrag-frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    environment:
      - VITE_API_PROXY_URL=http://backend:8080
      - VITE_MINIO_PROXY_URL=http://minio:9000
      # Link-preview / SEO metadata → %VITE_*% placeholders in index.html.
      # Override in the root .env; defaults below.
      - VITE_SITE_NAME=${VITE_SITE_NAME:-AIRAG}
      - VITE_SITE_TITLE=${VITE_SITE_TITLE:-AIRAG - AI Workspace}
      - "VITE_SITE_DESCRIPTION=${VITE_SITE_DESCRIPTION:-Trợ lý AI tra cứu kho tri thức nội bộ: tìm kiếm ngữ nghĩa, đồ thị tri thức và chat có trích dẫn nguồn từ văn bản của bạn.}"
      - VITE_PUBLIC_URL=${VITE_PUBLIC_URL:-https://rag.zbots.store}
    networks:
      - hrag_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`rag.hatinh.local`)"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.services.frontend.loadbalancer.server.port=5174"
      - "com.hrag.service=frontend"
      - "com.hrag.stack=hrag"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY — Loki + Grafana + Promtail
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Loki (all-in-one, ephemeral storage for dev) ───────────────────────
  loki:
    image: grafana/loki:3.2.0
    container_name: hrag-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - hrag_loki_data:/var/loki
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - hrag_network
    restart: unless-stopped

  # ── Promtail (reads Docker container logs) ──────────────────────────────
  promtail:
    image: grafana/promtail:3.2.0
    container_name: hrag-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail:/etc/promtail:ro
      - hrag_promtail_positions:/tmp/promtail
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.expand-env=true -config.file=/etc/promtail/config.yml
    networks:
      - hrag_network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  # ── Grafana (port 3000) ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - hrag_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - hrag_network
    restart: unless-stopped
    depends_on:
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.hatinh.local`)"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ── OpenViking (context-DB memory for LangGraph agents) ──────────────────
  # Optional memory backend selected via NEXUSRAG_MEMORY_BACKEND (openviking/both).
  # The backend reaches it at http://openviking:1933 over hrag_network; port 1933
  # is also published for the `ov` CLI / debugging. Config is injected wholesale
  # through OPENVIKING_CONF_CONTENT (server reads it via os.path.expandvars, so
  # $OPENVIKING_* placeholders resolve from env_file .env / environment).
  #   - embedding → AIRAG's own embed-rerank service (/v1/embeddings, OpenAI-compat)
  #   - vlm      → AIRAG's memory-agent LLM proxy (host.docker.internal:20128 / airag-memory)
  openviking:
    image: ghcr.io/volcengine/openviking:latest
    container_name: hrag-openviking
    ports:
      - "1933:1933"
    env_file: .env
    environment:
      OPENVIKING_SERVER_PORT: "1933"
      OPENVIKING_VLM_BASE_URL: ${OPENVIKING_VLM_BASE_URL:-http://host.docker.internal:20128/v1}
      OPENVIKING_VLM_MODEL: ${OPENVIKING_VLM_MODEL:-airag-memory}
      OPENVIKING_VLM_API_KEY: ${OPENVIKING_VLM_API_KEY:-sk-nexusrag}
      OPENVIKING_EMBED_BASE_URL: ${OPENVIKING_EMBED_BASE_URL:-http://embed-rerank:8090/v1}
      OPENVIKING_EMBED_MODEL: ${OPENVIKING_EMBED_MODEL:-vietlegal-harrier}
      OPENVIKING_EMBED_API_KEY: ${OPENVIKING_EMBED_API_KEY:-sk-none}
      # Full ov.conf injected at boot (entrypoint writes it to /app/.openviking/ov.conf).
      OPENVIKING_CONF_CONTENT: |
        {
          "server": {
            "host": "0.0.0.0",
            "port": 1933,
            "root_api_key": "$OPENVIKING_API_KEY",
            "auth_mode": "trusted"
          },
          "storage": {
            "workspace": "/app/data",
            "vectordb": {
              "name": "context",
              "backend": "local",
              "project": "default"
            },
            "agfs": {
              "backend": "local",
              "timeout": 10,
              "pathlock": {
                "provider": "filesystem",
                "lock_expire_secs": 30.0
              }
            }
          },
          "queue_workers": {
            "external_parse": {"max_concurrent": 2},
            "add_resource": {"max_concurrent": 2, "file_vectorization_concurrency": 4},
            "session_commit": {"max_concurrent": 4}
          },
          "embedding": {
            "dense": {
              "provider": "openai",
              "model": "$OPENVIKING_EMBED_MODEL",
              "api_base": "$OPENVIKING_EMBED_BASE_URL",
              "api_key": "$OPENVIKING_EMBED_API_KEY",
              "dimension": 1024,
              "input": "text"
            },
            "text_source": "content_only",
            "max_input_tokens": 4096
          },
          "vlm": {
            "provider": "openai",
            "model": "$OPENVIKING_VLM_MODEL",
            "api_base": "$OPENVIKING_VLM_BASE_URL",
            "api_key": "$OPENVIKING_VLM_API_KEY",
            "temperature": 0.0,
            "max_retries": 2,
            "media": {"enabled": false}
          },
          "retrieval": {
            "hotness_alpha": 0.0,
            "score_propagation_alpha": 1.0,
            "recall_intent_timeout_s": 5.0,
            "recall_rewrite_timeout_s": 30.0
          },
          "auto_generate_l0": true,
          "auto_generate_l1": true,
          "default_search_mode": "thinking",
          "default_search_limit": 3,
          "memory": {
            "version": "v2",
            "extraction_enabled": true,
            "session_skill_extraction_enabled": false
          },
          "log": {
            "level": "INFO",
            "format": "%(asctime)s - %(name)s - %(levelname)s - %(message)s",
            "output": "stdout",
            "rotation": true,
            "rotation_days": 3,
            "rotation_interval": "midnight"
          }
        }
    volumes:
      - hrag_openviking_config:/app/.openviking
      - hrag_openviking_data:/app/data
    networks:
      - hrag_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      com.hrag.service: openviking
      com.hrag.stack: hrag

volumes:
  hrag_postgres_data:
  hrag_chroma_data:
  hrag_rabbitmq_data:
  hrag_minio_data:
  hrag_neo4j_data:
  hrag_uploads:
  hrag_data:
  hrag_loki_data:
  hrag_grafana_data:
  hrag_traefik_data:
  hrag_promtail_positions:
  hrag_omnivoice_profiles:
  hrag_omnivoice_hf:
  hrag_openviking_config:
  hrag_openviking_data: