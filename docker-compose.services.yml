# HRAG — Dev/Production services with Workers
# Usage: docker compose -f docker-compose.services.yml up -d

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg15
    container_name: hrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrag
    ports:
      - "5433:5432"
    volumes:
      - hrag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.hrag.service: postgres
      com.hrag.stack: hrag

  chromadb:
    image: chromadb/chroma:latest
    container_name: hrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - hrag_chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    labels:
      com.hrag.service: chromadb
      com.hrag.stack: hrag

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrag-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - hrag_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      com.hrag.service: rabbitmq
      com.hrag.stack: hrag

  minio:
    image: minio/minio:latest
    container_name: hrag-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_NEXUSRAG: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_NEXUSRAG: http://host.docker.internal:8080/api/v1/minio/events
    volumes:
      - hrag_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.hrag.service: minio
      com.hrag.stack: hrag

  neo4j:
    image: neo4j:5-community
    container_name: hrag-neo4j
    ports:
      - "7474:7474"   # Browser UI → http://localhost:7474
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/hrag12345
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - hrag_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      com.hrag.service: neo4j
      com.hrag.stack: hrag

  # ═══════════════════════════════════════════════════════════════════════════
  # VLLM SERVICES — GPU 1 (same as workers, 48GB VRAM total)
  # HunyuanOCR: ~19.2GB (0.4), Qwen3-4B: ~9.6GB (0.2) → ~28.8GB used
  # Remaining ~19GB for workers (parse ~4-6GB, embed ~1-2GB)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── HunyuanOCR (OCR Model) ────────────────────────────────────────────────
  # Port: 8001, GPU 1, ~19.2GB VRAM (0.4 × 48GB)
  # OpenAI-compatible API → workers call via Docker network
  vllm-ocr:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-ocr
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - tencent/HunyuanOCR
      - --port
      - "8001"
      - --max-model-len
      - "25384"
      - --gpu-memory-utilization
      - "0.4"
      - --trust-remote-code
      - --served-model-name
      - hunyuan-ocr
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-ocr
      com.hrag.stack: hrag

  # ── Qwen3-4B-Instruct (Memory/KG Model) ──────────────────────────────────
  # Port: 8088, GPU 1, ~9.6GB VRAM (0.2 × 48GB)
  # OpenAI-compatible API → workers call via Docker network
  vllm-memory:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-memory
    ports:
      - "8088:8088"
    environment:
      NVIDIA_VISIBLE_DEVICES: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - Qwen/Qwen3-4B-Instruct-2507-FP8
      - --port
      - "8088"
      - --max-model-len
      - "25000"
      - --gpu-memory-utilization
      - "0.3"
      - --trust-remote-code
      - --served-model-name
      - qwen-memory
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-memory
      com.hrag.stack: hrag

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKERS — All use GPU 1 (same as vLLM services, 48GB VRAM total)
  # vLLM uses ~28.8GB, workers have ~19GB available (parse ~4-6GB, embed ~1-2GB)
  # Caption/KG workers don't load GPU models (HTTP calls / CPU-bound)
  # All workers include: graceful drain (WORKER_DRAIN_TIMEOUT=30s),
  # stop_grace_period=60s (Docker waits 60s before SIGKILL on stop)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Parse workers ─────────────────────────────────────────────────────────
  # Docling (layout + OCR) → ~4-6GB VRAM when loaded
  # Lazy load (HRAG_EAGER_MODEL_LOADING=false) to avoid VRAM spike at startup
  # Health server on port 8081, exposed to host on port 8082
  worker-parse:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      vllm-ocr:
        condition: service_healthy
      vllm-memory:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: parse
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_DOCLING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8082:8081"
    labels:
      com.hrag.service: worker-parse
      com.hrag.stack: hrag

  # ── Embed workers ───────────────────────────────────────────────────────────
  # BGE-m3 embedding model → ~1-2GB VRAM
  # Health server on port 8081
  worker-embed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: embed
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_EMBEDDING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
      WORKER_EMBED_TIMEOUT: "300"
      HRAG_CONTEXTUAL_CONCURRENCY: "16"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8083:8081"
    labels:
      com.hrag.service: worker-embed
      com.hrag.stack: hrag

  # ── Caption workers ─────────────────────────────────────────────────────────
  # Vision LLM captions via HTTP calls to vLLM (no GPU model loaded in worker)
  # Workers call LLM provider via HTTP — GPU not used by caption worker process
  # Health server on port 8081
  worker-caption:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: caption
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8084:8081"
    labels:
      com.hrag.service: worker-caption
      com.hrag.stack: hrag

  # ── KG workers ─────────────────────────────────────────────────────────────
  # LightRAG file-based KG extraction (CPU-bound, no GPU model)
  # GPU assigned for consistency but not used
  # Health server on port 8081
  worker-kg:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vllm-memory:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: kg
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      LEGAL_KG_LLM_BASE_URL: http://vllm-memory:8088/v1
    volumes:
      - hrag_data:/app/backend/data
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8085:8081"
    labels:
      com.hrag.service: worker-kg
      com.hrag.stack: hrag

  # ── Backend API server ─────────────────────────────────────────────────────
  # Optional: include backend if you want full stack in docker
  # Comment out if running backend locally (./run_bk.sh)
  # backend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   container_name: hrag-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     chromadb:
  #       condition: service_started
  #     minio:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
  #     CHROMA_HOST: chromadb
  #     CHROMA_PORT: 8000
  #     RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  #     MINIO_ENDPOINT: http://minio:9000
  #     MINIO_WEBHOOK_ENABLED: "false"
  #     NEO4J_URI: bolt://neo4j:7687
  #     CUDA_VISIBLE_DEVICES: "0"
  #   volumes:
  #     - hrag_uploads:/app/backend/uploads
  #     - hrag_data:/app/backend/data
  #   ports:
  #     - "8080:8080"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["1"]
  #             capabilities: [gpu]
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s
  #   restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY — Loki + Grafana + Promtail
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Loki (all-in-one, ephemeral storage for dev) ───────────────────────
  loki:
    image: grafana/loki:3.2.0
    container_name: hrag-loki
    ports:
      - "3100:3100"
    volumes:
      - hrag_loki_data:/var/loki
    restart: unless-stopped

  # ── Promtail (reads Docker container logs) ──────────────────────────────
  promtail:
    image: grafana/promtail:3.2.0
    container_name: hrag-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail:/etc/promtail:ro
      - hrag_promtail_positions:/tmp/promtail
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  # ── Grafana (port 3000) ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - hrag_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - loki

volumes:
  hrag_postgres_data:
  hrag_chroma_data:
  hrag_rabbitmq_data:
  hrag_minio_data:
  hrag_neo4j_data:
  hrag_uploads:
  hrag_data:
  hrag_loki_data:
  hrag_grafana_data:
  hrag_promtail_positions: