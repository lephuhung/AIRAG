# HRAG — Dev/Production services with Workers
# Usage: docker compose -f docker-compose.services.yml up -d

networks:
  hrag_network:
    driver: bridge

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # TRAEFIK REVERSE PROXY
  # ═══════════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:latest
    container_name: hrag-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "8089:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - hrag_traefik_data:/letsencrypt
    networks:
      - hrag_network
    environment:
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    labels:
      - "com.hrag.service=traefik"
      - "com.hrag.stack=hrag"
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.hatinh.local`)"
      - "traefik.http.routers.traefik.entrypoints=http"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg15
    container_name: hrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrag
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "5433:5432"
    volumes:
      - hrag_postgres_data:/var/lib/postgresql/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      com.hrag.service: postgres
      com.hrag.stack: hrag

  chromadb:
    image: chromadb/chroma:latest
    container_name: hrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - hrag_chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - hrag_network
    labels:
      com.hrag.service: chromadb
      com.hrag.stack: hrag

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrag-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672  (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - hrag_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      com.hrag.service: rabbitmq
      com.hrag.stack: hrag

  minio:
    image: minio/minio:latest
    container_name: hrag-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_NEXUSRAG: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_NEXUSRAG: http://host.docker.internal:8080/api/v1/minio/events
    volumes:
      - hrag_minio_data:/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.hrag.service: minio
      com.hrag.stack: hrag
      traefik.enable: "true"
      traefik.http.routers.minio.rule: "Host(`minio.hatinh.local`)"
      traefik.http.routers.minio.entrypoints: "http"
      traefik.http.services.minio.loadbalancer.server.port: "9000"

  neo4j:
    image: neo4j:5-community
    container_name: hrag-neo4j
    ports:
      - "7474:7474"   # Browser UI → http://localhost:7474
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/hrag1234
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - hrag_neo4j_data:/data
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      com.hrag.service: neo4j
      com.hrag.stack: hrag

  # ═══════════════════════════════════════════════════════════════════════════
  # VLLM SERVICES — GPU 1 (same as workers, 48GB VRAM total)
  # HunyuanOCR: ~19.2GB (0.4), Qwen3-4B: ~9.6GB (0.2) → ~28.8GB used
  # Remaining ~19GB for workers (parse ~4-6GB, embed ~1-2GB)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── HunyuanOCR (OCR Model) ────────────────────────────────────────────────
  # Port: 8001, GPU 1, ~19.2GB VRAM (0.4 × 48GB)
  # OpenAI-compatible API → workers call via Docker network
  vllm-ocr:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-ocr
    ports:
      - "8001:8001"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - tencent/HunyuanOCR
      - --port
      - "8001"
      - --max-model-len
      - "12000"
      - --gpu-memory-utilization
      - "0.2"
      - --trust-remote-code
      - --served-model-name
      - hunyuan-ocr
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-ocr
      com.hrag.stack: hrag

  # ── Qwen3-4B-Instruct (Memory/KG Model) ──────────────────────────────────
  # Port: 8088, GPU 1, ~9.6GB VRAM (0.2 × 48GB)
  # OpenAI-compatible API → workers call via Docker network
  vllm-memory:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: hrag-vllm-memory
    ports:
      - "8088:8088"
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      HF_TOKEN: "${HF_TOKEN}"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      VLLM_USE_V1: "0"
      VLLM_DISABLE_NIXL: "1"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command:
      - google/gemma-4-E4B-it
      - --port
      - "8088"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.4"
      - --trust-remote-code
      - --served-model-name
      - qwen-memory
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks:
      - hrag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.hrag.service: vllm-memory
      com.hrag.stack: hrag

  # ═══════════════════════════════════════════════════════════════════════════
  # WORKERS — All use GPU 1 (same as vLLM services, 48GB VRAM total)
  # vLLM uses ~28.8GB, workers have ~19GB available (parse ~4-6GB, embed ~1-2GB)
  # Caption/KG workers don't load GPU models (HTTP calls / CPU-bound)
  # All workers include: graceful drain (WORKER_DRAIN_TIMEOUT=30s),
  # stop_grace_period=60s (Docker waits 60s before SIGKILL on stop)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Parse workers ─────────────────────────────────────────────────────────
  # Docling (layout + OCR) → ~4-6GB VRAM when loaded
  # Lazy load (HRAG_EAGER_MODEL_LOADING=false) to avoid VRAM spike at startup
  # Health server on port 8081, exposed to host on port 8082
  worker-parse:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      vllm-ocr:
        condition: service_healthy
      vllm-memory:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: parse
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_DOCLING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
    deploy:
      replicas: 2
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-parse
      com.hrag.stack: hrag

  # ── Embed workers ───────────────────────────────────────────────────────────
  # BGE-m3 embedding model → ~1-2GB VRAM
  # Health server on port 8081
  worker-embed:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: embed
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      NEXUSRAG_EMBEDDING_DEVICE: cuda
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
      WORKER_EMBED_TIMEOUT: "300"
      HRAG_CONTEXTUAL_CONCURRENCY: "16"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
    deploy:
      replicas: 3
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-embed
      com.hrag.stack: hrag

  # ── Caption workers ─────────────────────────────────────────────────────────
  # Vision LLM captions via HTTP calls to vLLM (no GPU model loaded in worker)
  # Workers call LLM provider via HTTP — GPU not used by caption worker process
  # Health server on port 8081
  worker-caption:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      WORKER_TYPE: caption
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
    volumes:
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-caption
      com.hrag.stack: hrag

  # ── KG workers ─────────────────────────────────────────────────────────────
  # LightRAG file-based KG extraction (CPU-bound, no GPU model)
  # GPU assigned for consistency but not used
  # Health server on port 8081
  worker-kg:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      vllm-memory:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      NEO4J_URI: bolt://neo4j:7687
      WORKER_TYPE: kg
      AUTO_CREATE_TABLES: "false"
      CUDA_VISIBLE_DEVICES: "0"
      WORKER_DRAIN_TIMEOUT: "30"
      WORKER_HEALTH_PORT: "8081"
      LEGAL_KG_LLM_BASE_URL: http://vllm-memory:8088/v1
    volumes:
      - hrag_data:/app/backend/data
    networks:
      - hrag_network
    extra_hosts:
      - "langfuse.hatinh.local:10.10.0.241"
    stop_grace_period: 60s
    command: ["python", "-m", "app.workers.runner"]
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.hrag.service: worker-kg
      com.hrag.stack: hrag

  # ── Backend API server ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        TARGET: ${APP_ENV:-development}
    container_name: hrag-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/hrag
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: http://minio:9000
      MINIO_WEBHOOK_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      CUDA_VISIBLE_DEVICES: "0"
      HRAG_EAGER_MODEL_LOADING: "false"
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      HUNYUAN_OCR_API_URL: http://vllm-ocr:8001/v1
      MEMORY_AGENT_BASE_URL: http://vllm-memory:8088/v1
      GRAPHITI_LLM_BASE_URL: http://vllm-memory:8088/v1
      LEGAL_KG_LLM_BASE_URL: http://vllm-memory:8088/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "langfuse.hatinh.local:10.10.0.241"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - hrag_uploads:/app/backend/uploads
      - hrag_data:/app/backend/data
      - ./backend:/app/backend:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hrag_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`service.hatinh.local`)"
      - "traefik.http.routers.backend.entrypoints=http"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        TARGET: ${APP_ENV:-development}
    container_name: hrag-frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    environment:
      - VITE_API_PROXY_URL=http://backend:8080
      - VITE_MINIO_PROXY_URL=http://minio:9000
    networks:
      - hrag_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`rag.hatinh.local`)"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.services.frontend.loadbalancer.server.port=5174"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # OBSERVABILITY — Loki + Grafana + Promtail
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Loki (all-in-one, ephemeral storage for dev) ───────────────────────
  loki:
    image: grafana/loki:3.2.0
    container_name: hrag-loki
    ports:
      - "3100:3100"
    volumes:
      - hrag_loki_data:/var/loki
    networks:
      - hrag_network
    restart: unless-stopped

  # ── Promtail (reads Docker container logs) ──────────────────────────────
  promtail:
    image: grafana/promtail:3.2.0
    container_name: hrag-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail:/etc/promtail:ro
      - hrag_promtail_positions:/tmp/promtail
      - /home/docker/containers:/home/docker/containers:ro
    command: -config.expand-env=true -config.file=/etc/promtail/config.yml
    networks:
      - hrag_network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  # ── Grafana (port 3000) ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - hrag_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - hrag_network
    restart: unless-stopped
    depends_on:
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.hatinh.local`)"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  hrag_postgres_data:
  hrag_chroma_data:
  hrag_rabbitmq_data:
  hrag_minio_data:
  hrag_neo4j_data:
  hrag_uploads:
  hrag_data:
  hrag_loki_data:
  hrag_grafana_data:
  hrag_traefik_data:
  hrag_promtail_positions: