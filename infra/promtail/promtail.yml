server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_targets:
      - __HOST_PROMTARGET__: "localhost"
    relabel_configs:
      # Map Docker container labels to Loki labels
      - source_labels: [__meta_docker_container_label_com_nexusrag_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_nexusrag_stack]
        target_label: stack
      # Clean container name (remove leading /)
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
        replacement: '${1}'
        regex: '/(.*)'