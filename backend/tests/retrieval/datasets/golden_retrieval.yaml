# Golden retrieval set — đo chất lượng hybrid retrieval (DeepRetriever.query)
# trên kho thật. Queries lấy từ agent_traces (câu hỏi người dùng thật, đã dedup)
# + biến thể tay để phủ các dạng: tham chiếu điều khoản, câu hỏi khái niệm,
# công văn không cấu trúc, viết tắt, out-of-corpus.
#
# Nhãn (expect_article) được đối chiếu thủ công với danh sách "Điều N. <tiêu đề>"
# dump từ ChromaDB ngày 2026-07-03 — sửa nhãn phải kiểm tra lại văn bản gốc.
#
# Schema mỗi case:
#   id:               định danh duy nhất, tiền tố sec-/con-/doc-/neg-
#   query:            câu hỏi (nguyên văn hoặc gần nguyên văn trace thật)
#   expect_document:  pattern ILIKE trên documents.document_number — văn bản
#                     chứa câu trả lời; đồng thời neo workspace cho case
#   accept_documents: (tùy chọn) pattern các văn bản khác cũng tính là đúng
#                     ở mức document (vd luật cũ/luật mới cùng chủ đề)
#   expect_article:   (tùy chọn) list số Điều chứa câu trả lời — chỉ chấm
#                     trong expect_document (không chấm accept_documents)
#   negative:         true = câu hỏi ngoài kho; đo score/độ nhiễu, không tính recall
#   tags:             để lọc/phân tích report, không ảnh hưởng chấm điểm

defaults:
  top_k: 8
  mode: hybrid

cases:
  # ── Workspace: 85/2016/NĐ-CP + 361/2025/NĐ-CP ──────────────────────────────
  - id: sec-85-d17
